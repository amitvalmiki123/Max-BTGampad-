name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests (HID report / X+A = 0x05)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee -a build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GamePadPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report build result as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ GamePad Pro build SUCCESS (unit tests + debug APK) — run ${{ github.run_id }}. APK is attached as artifact 'GamePadPro-debug-apk' in the Actions run." > comment.md
          else
            { echo "❌ GamePad Pro build FAILED — run ${{ github.run_id }}. Error lines:";
              echo '```';
              grep -E "e: |error:|FAILED|FAILURE|What went wrong|Execution failed|Caused by:" build.log | tail -70 || true;
              echo '--- tail ---';
              tail -50 build.log || true;
              echo '```'; } > comment.md
          fi
          head -c 60000 comment.md > comment-trunc.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment-trunc.md || true
